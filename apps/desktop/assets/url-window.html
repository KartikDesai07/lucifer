  <title>Server address</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, sans-serif;
      background: #ffffff;
      color: #1a1a1a;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }
    .header img {
      width: 40px;
      height: 40px;
      border-radius: 8px;
    }
    .header .product {
      font-size: 16px;
      font-weight: 600;
    }
    .header .step {
      font-size: 12px;
      color: #666666;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      font-size: 14px;
      border: 1px solid #b0b0b0;
      border-radius: 4px;
    }
    .hint {
      margin-top: 8px;
      font-size: 12px;
      color: #666666;
    }
    #error {
      margin-top: 8px;
      font-size: 13px;
      color: #b00020;
      min-height: 16px;
    }
    .buttons {
      margin-top: 20px;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    button {
      padding: 8px 16px;
      font-size: 14px;
      border-radius: 4px;
      border: 1px solid #b0b0b0;
      background: #f2f2f2;
      cursor: pointer;
    }
    button.primary {
      background: #1a73e8;
      border-color: #1a73e8;
      color: #ffffff;
    }
    button:disabled {
      opacity: 0.5;
      cursor: default;
    }
  </style>
