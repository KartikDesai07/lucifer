<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>POS Software — QR self-ordering poster</title>
<!--
  POSTER 3 · QR SELF-ORDERING · 1080 × 1350 (4:5 portrait)
  Edit the JSON block below and re-render:
      cd F:/lucifer && bash marketing/tools/render.sh poster-3-qr
  Output: marketing/out/poster-3-qr.png (2160 × 2700, 2x)
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Manrope:wght@600;700;800&display=swap">
<script type="application/json" id="poster-data">
{
  "brand": "POS Software",
  "by": "by sandbee",
  "eyebrow": "QR self-ordering",
  "headline": ["Your tables take", "their own orders."],
  "subhead": "Diners scan the table QR and order from their phone. You approve on the POS — or let it fire straight to the kitchen printer.",
  "steps": [
    { "n": "1", "title": "Scan", "text": "A QR card on every table. No app to install." },
    { "n": "2", "title": "Order", "text": "Menu, sizes and add-ons, promo codes — on the diner\u2019s own phone." },
    { "n": "3", "title": "Approve & cook", "text": "The request lands on your POS; one tap and the KOT prints itself." }
  ],
  "chips": ["No app download", "Approve or auto-fire", "Works on any phone", "Promo codes at checkout"],
  "price": "\u20b925,000 once \u00b7 use it for life\n+ \u20b95,000 WhatsApp credit included",
  "cta": "Book a free demo",
  "whatsapp": "+91 XXXXX XXXXX",
  "site": "pos.sandbee.in",
  "menu": {
    "cafe": "Sunrise Caf\u00e9",
    "items": [["Cappuccino", "\u20b9120"], ["Veg Club Sandwich", "\u20b9180"], ["Peri-Peri Fries", "\u20b9120"]],
    "bar": "2 items \u00b7 \u20b9300 \u00b7 Place order \u2192"
  },
  "table": "Table 6 \u00b7 Scan to order",
  "pos": { "title": "Order requests", "meta": "Table 6 \u00b7 \u20b9300", "btn": "Approve" },
  "kot": { "title": "KITCHEN ORDER", "meta": "Table 6" }
}
</script>
<style>
  :root {
    --w: 1080px; --h: 1350px;
    --deep: #0b3d2a; --mid: #1f9f6c; --mint: #3ddc97;
    --ink: #ffffff; --dark: #15201a; --muted: #6b776f;
    --display: "Fraunces", Georgia, "Times New Roman", serif;
    --body: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: var(--w); height: var(--h); background: var(--deep); overflow: hidden; }
  body { font-family: var(--body); color: var(--ink); -webkit-font-smoothing: antialiased; }

  .poster {
    position: relative; width: var(--w); height: var(--h); overflow: hidden;
    padding: 60px 60px 56px; display: flex; flex-direction: column;
    background: linear-gradient(135deg, var(--deep) 0%, var(--mid) 58%, var(--mint) 100%);
  }
  .blob { position: absolute; border-radius: 50%; filter: blur(2px); pointer-events: none; }
  .blob-a { width: 640px; height: 640px; left: -220px; top: -260px; background: radial-gradient(circle, rgba(255,255,255,.16), transparent 70%); }
  .blob-b { width: 520px; height: 520px; right: -180px; top: 380px; background: radial-gradient(circle, rgba(255,255,255,.13), transparent 70%); }
  .blob-c { width: 460px; height: 460px; left: 60px; bottom: -220px; background: radial-gradient(circle, rgba(255,255,255,.12), transparent 70%); }

  /* header */
  .top { position: relative; display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .mark { width: 68px; height: 68px; border-radius: 18px; overflow: hidden; background: var(--deep); box-shadow: 0 10px 24px rgba(0,0,0,.25); flex: none; }
  .mark img { width: 160%; height: 160%; object-fit: contain; display: block; transform: translate(-19%, -19%); }
  .brand-name { font-size: 28px; font-weight: 800; letter-spacing: -.01em; line-height: 1; }
  .brand-by { margin-top: 6px; font-size: 15px; color: rgba(255,255,255,.82); font-weight: 700; letter-spacing: .02em; }
  .pill-top { padding: 12px 18px; border-radius: 999px; font-size: 14px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--ink); background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.3); }

  /* hero text */
  .intro { position: relative; margin-top: 34px; }
  .eyebrow { display: inline-flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--ink); opacity: .92; }
  .eyebrow::before { content: ""; width: 26px; height: 2px; background: var(--ink); border-radius: 2px; }
  h1 { font-family: var(--display); font-weight: 700; font-size: 66px; line-height: 1.03; letter-spacing: -.02em; margin-top: 16px; }
  .sub { margin-top: 16px; font-size: 21px; line-height: 1.5; color: rgba(255,255,255,.92); font-weight: 600; max-width: 880px; }

  /* flow */
  .flow { position: relative; margin-top: 30px; flex: 1 1 auto; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; align-items: stretch; }
  .step { position: relative; display: flex; flex-direction: column; }
  .step-head { display: flex; align-items: center; gap: 12px; }
  .num { width: 34px; height: 34px; border-radius: 50%; background: var(--ink); color: var(--deep); font-weight: 800; font-size: 17px; display: grid; place-items: center; flex: none; }
  .step-title { font-size: 19px; font-weight: 800; letter-spacing: -.005em; }
  .step-text { margin-top: 8px; font-size: 15px; line-height: 1.42; color: rgba(255,255,255,.88); font-weight: 600; }
  .dots { position: absolute; top: 17px; left: calc(100% + 6px); width: 14px; border-top: 3px dotted rgba(255,255,255,.65); }

  .card {
    margin-top: 16px; flex: 1 1 auto; border-radius: 26px; background: rgba(255,255,255,.94);
    box-shadow: 0 24px 50px rgba(5,30,20,.28); display: flex; align-items: center; justify-content: center;
    padding: 20px; position: relative; overflow: visible;
  }

  /* step 1: QR tent card */
  .tent { display: flex; flex-direction: column; align-items: center; gap: 22px; }
  .qr-frame { padding: 20px; border-radius: 22px; background: #fff; border: 1px solid #e7e9e6; box-shadow: 0 14px 30px rgba(21,32,26,.1); }
  .qr { width: 296px; height: 296px; position: relative; }
  .qr-grid { width: 100%; height: 100%; display: grid; grid-template-columns: repeat(21, 1fr); grid-template-rows: repeat(21, 1fr); gap: 1px; }
  .qr-cell { background: var(--dark); border-radius: 0.5px; }
  .qr-cell.off { background: transparent; }
  .finder { position: absolute; width: 54px; height: 54px; border: 8px solid var(--dark); border-radius: 4px; background: #fff; }
  .finder::after { content: ""; position: absolute; inset: 10px; background: var(--dark); border-radius: 2px; }
  .finder.tl { top: 0; left: 0; }
  .finder.tr { top: 0; right: 0; }
  .finder.bl { bottom: 0; left: 0; }
  .tent-caption { font-size: 19px; font-weight: 800; color: var(--dark); text-align: center; }

  /* step 2: phone */
  .phone { width: 258px; height: 560px; border-radius: 48px; background: #14181a; padding: 14px; box-shadow: 0 16px 30px rgba(0,0,0,.3); display: flex; flex-direction: column; }
  .phone-screen { flex: 1 1 auto; background: #fbfbf9; border-radius: 34px; overflow: hidden; display: flex; flex-direction: column; }
  .phone-head { padding: 22px 16px 14px; text-align: center; font-size: 17px; font-weight: 800; color: var(--dark); border-bottom: 1px solid #ece9e2; }
  .phone-items { flex: 1 1 auto; padding: 16px 16px; display: flex; flex-direction: column; gap: 14px; justify-content: center; }
  .menu-row { display: flex; align-items: center; justify-content: space-between; background: #fff; border: 1px solid #ece9e2; border-radius: 14px; padding: 13px 14px; }
  .menu-row .mi-name { font-size: 14.5px; font-weight: 700; color: var(--dark); }
  .menu-row .mi-price { font-size: 13px; font-weight: 700; color: var(--muted); margin-top: 3px; }
  .menu-row .add { font-size: 12.5px; font-weight: 800; color: var(--mid); border: 1.5px solid var(--mid); border-radius: 999px; padding: 6px 12px; white-space: nowrap; }
  .phone-bar { background: var(--dark); color: #fff; font-size: 12.5px; font-weight: 800; padding: 18px 12px; text-align: center; white-space: nowrap; }

  /* step 3: pos + kot */
  .posstack { position: relative; width: 100%; height: 470px; display: flex; align-items: center; justify-content: center; }
  .ticket { position: absolute; width: 184px; background: #fffdf7; border-radius: 6px; padding: 20px 18px 30px; box-shadow: 0 10px 24px rgba(0,0,0,.22); transform: rotate(9deg); top: 10px; right: 14px; font-family: var(--body); }
  .ticket-title { font-size: 13px; font-weight: 800; letter-spacing: .06em; text-align: center; color: var(--dark); }
  .ticket-meta { font-size: 11px; color: var(--muted); text-align: center; margin-top: 4px; }
  .ticket-rule { border-top: 1.5px dashed #cfcabf; margin: 10px 0; }
  .ticket-row { font-size: 12.5px; font-weight: 700; color: var(--dark); display: flex; gap: 6px; padding: 2px 0; }
  .stamp { position: absolute; right: 10px; bottom: 10px; transform: rotate(-10deg); border: 2px solid var(--mid); color: var(--mid); font-size: 10.5px; font-weight: 800; letter-spacing: .08em; padding: 4px 8px; border-radius: 5px; }
  .req-card { position: absolute; bottom: 12px; left: 8px; width: 240px; background: #fff; border-radius: 18px; padding: 20px 20px 22px; box-shadow: 0 20px 36px rgba(5,30,20,.24); border: 1px solid #ece9e2; }
  .req-title { font-size: 16px; font-weight: 800; color: var(--dark); }
  .req-meta { font-size: 13.5px; color: var(--muted); font-weight: 700; margin-top: 5px; }
  .req-btn { margin-top: 16px; background: var(--mid); color: #fff; text-align: center; font-size: 14.5px; font-weight: 800; padding: 12px; border-radius: 12px; }

  /* chips + bottom band */
  .chips { position: relative; margin-top: 26px; display: flex; flex-wrap: nowrap; gap: 10px; }
  .chip { white-space: nowrap; font-size: 14px; font-weight: 800; color: var(--ink); padding: 10px 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,.4); background: rgba(255,255,255,.14); display: inline-flex; align-items: center; gap: 8px; }
  .chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ink); }

  .band { position: relative; margin-top: 22px; border-radius: 26px; background: rgba(255,255,255,.94); box-shadow: 0 24px 50px rgba(5,30,20,.28); padding: 24px 28px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
  .band-price { font-size: 17px; font-weight: 800; color: var(--dark); max-width: 400px; line-height: 1.4; white-space: pre-line; }
  .band-right { display: flex; align-items: center; gap: 18px; flex: none; }
  .btn-cta { display: inline-flex; align-items: center; gap: 10px; padding: 16px 24px; border-radius: 14px; background: var(--dark); color: #fff; font-size: 18px; font-weight: 800; white-space: nowrap; }
  .btn-cta svg { width: 20px; height: 20px; flex: none; }
  .contact { display: flex; flex-direction: column; gap: 4px; }
  .contact-row { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 800; color: var(--dark); white-space: nowrap; }
  .contact-row svg { width: 16px; height: 16px; flex: none; color: var(--mid); }
</style>
</head>
<body>
<div class="poster">
  <div class="blob blob-a"></div>
  <div class="blob blob-b"></div>
  <div class="blob blob-c"></div>

  <header class="top">
    <div class="brand">
      <div class="mark"><img src="assets/sandbee-logo.png" alt=""></div>
      <div>
        <div class="brand-name" data-k="brand"></div>
        <div class="brand-by" data-k="by"></div>
      </div>
    </div>
  </header>

  <section class="intro">
    <div class="eyebrow" data-k="eyebrow"></div>
    <h1 id="headline"></h1>
    <p class="sub" data-k="subhead"></p>
  </section>

  <section class="flow">
    <div class="step">
      <div class="step-head"><div class="num">1</div><div class="step-title" id="s1-title"></div></div>
      <div class="step-text" id="s1-text"></div>
      <div class="dots"></div>
      <div class="card">
        <div class="tent">
          <div class="qr-frame">
            <div class="qr">
              <div class="qr-grid" id="qr-grid"></div>
              <div class="finder tl"></div><div class="finder tr"></div><div class="finder bl"></div>
            </div>
          </div>
          <div class="tent-caption" id="table-caption"></div>
        </div>
      </div>
    </div>
    <div class="step">
      <div class="step-head"><div class="num">2</div><div class="step-title" id="s2-title"></div></div>
      <div class="step-text" id="s2-text"></div>
      <div class="dots"></div>
      <div class="card">
        <div class="phone">
          <div class="phone-screen">
            <div class="phone-head" id="menu-cafe"></div>
            <div class="phone-items" id="menu-items"></div>
            <div class="phone-bar" id="menu-bar"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="step">
      <div class="step-head"><div class="num">3</div><div class="step-title" id="s3-title"></div></div>
      <div class="step-text" id="s3-text"></div>
      <div class="card">
        <div class="posstack">
          <div class="ticket">
            <div class="ticket-title" id="kot-title"></div>
            <div class="ticket-meta" id="kot-meta"></div>
            <div class="ticket-rule"></div>
            <div class="ticket-row">2× Cappuccino</div>
            <div class="ticket-row">1× Sandwich</div>
            <div class="ticket-row">1× Fries</div>
            <div class="stamp">PRINTED</div>
          </div>
          <div class="req-card">
            <div class="req-title" id="pos-title"></div>
            <div class="req-meta" id="pos-meta"></div>
            <div class="req-btn" id="pos-btn"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div class="chips" id="chips"></div>

  <section class="band">
    <div class="band-price" data-k="price"></div>
    <div class="band-right">
      <div class="btn-cta">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v11H8l-4 4z"/><path d="M8 8h8M8 11.5h5"/></svg>
        <span id="cta-btn"></span>
      </div>
      <div class="contact">
        <div class="contact-row">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-13.4 7.8L3 21l1.3-4.4A9 9 0 1 1 21 12z"/></svg>
          <span id="cta-wa"></span>
        </div>
        <div class="contact-row">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/></svg>
          <span id="cta-site"></span>
        </div>
      </div>
    </div>
  </section>
</div>

<script>
(function () {
  var data = JSON.parse(document.getElementById("poster-data").textContent);
  function text(id, v) { var el = document.getElementById(id) || document.querySelector('[data-k="' + id + '"]'); if (el) el.textContent = v; }
  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined) e.textContent = txt; return e; }

  text("brand", data.brand); text("by", data.by); text("eyebrow", data.eyebrow);
  text("eyebrowPill", data.eyebrow); text("subhead", data.subhead);
  text("price", data.price); text("cta-btn", data.cta); text("cta-wa", data.whatsapp); text("cta-site", data.site);
  text("table-caption", data.table);
  text("kot-title", data.kot.title); text("kot-meta", data.kot.meta);
  text("pos-title", data.pos.title); text("pos-meta", data.pos.meta); text("pos-btn", data.pos.btn);
  text("menu-cafe", data.menu.cafe); text("menu-bar", data.menu.bar);

  var h1 = document.getElementById("headline");
  data.headline.forEach(function (line, i) {
    if (i) h1.appendChild(document.createElement("br"));
    h1.appendChild(document.createTextNode(line));
  });

  var steps = data.steps;
  text("s1-title", steps[0].title); text("s1-text", steps[0].text);
  text("s2-title", steps[1].title); text("s2-text", steps[1].text);
  text("s3-title", steps[2].title); text("s3-text", steps[2].text);

  var chips = document.getElementById("chips");
  data.chips.forEach(function (c) { chips.appendChild(el("span", "chip", c)); });

  var mi = document.getElementById("menu-items");
  data.menu.items.forEach(function (it) {
    var row = el("div", "menu-row");
    var left = el("div");
    left.appendChild(el("div", "mi-name", it[0]));
    left.appendChild(el("div", "mi-price", it[1]));
    row.appendChild(left);
    row.appendChild(el("div", "add", "+ Add"));
    mi.appendChild(row);
  });

  /* decorative QR-like pattern: fixed seed (simple LCG) so it renders identically every time,
     ~45% dark fill, 21x21 modules, finder zones left blank for the corner squares — never a real scannable code */
  var QR_SIZE = 21;
  var qrGrid = document.getElementById("qr-grid");
  var finderZones = function (r, c) {
    return (r < 7 && c < 7) || (r < 7 && c > QR_SIZE - 8) || (r > QR_SIZE - 8 && c < 7);
  };
  var seed = 42;
  var nextBit = function () {
    seed = (seed * 1103515245 + 12345) & 0x7fffffff;
    return ((seed >> 8) % 100) < 46;
  };
  for (var r = 0; r < QR_SIZE; r++) {
    for (var c = 0; c < QR_SIZE; c++) {
      if (finderZones(r, c)) { qrGrid.appendChild(el("div", "qr-cell off")); continue; }
      var on = nextBit();
      qrGrid.appendChild(el("div", on ? "qr-cell" : "qr-cell off"));
    }
  }

  var FONT_WAIT_MS = 4000;
  var fontsReady = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
  var timeout = new Promise(function (r) { setTimeout(r, FONT_WAIT_MS); });
  Promise.race([fontsReady, timeout]).then(function () {
    requestAnimationFrame(function () { requestAnimationFrame(function () { document.documentElement.dataset.ready = "1"; }); });
  });
})();
</script>
</body>
</html>
